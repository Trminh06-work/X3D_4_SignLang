# One Slurm array task per entry, written as SIZE:FROZEN_BLOCKS.
#   Sizes  : XS, S, M
#   Frozen : 0 trains the whole network, 5 trains the new head alone
# The --array range in train.sh must cover every entry: 18 here -> 0-17.
# Grouped by size, so the six tasks sharing a cache queue behind one build.
JOBS="XS:0,XS:1,XS:2,XS:3,XS:4,XS:5,S:0,S:1,S:2,S:3,S:4,S:5,M:0,M:1,M:2,M:3,M:4,M:5"

# Training clips to sample. Leave empty to use all 28,142.
SUBSET=""

EPOCHS="100"
BATCH_SIZE="16"
LEARNING_RATE="1e-4"

CACHE_DIR="cache"

# Where the state_dicts, training curves and scores are written, relative to
# the project root.
CHECKPOINT_DIR="checkpoints"
FIGURE_DIR="figures"
RESULTS_DIR="results"

CONDA_ENV_NAME="videoCV"
PYTHON_BIN="python"
